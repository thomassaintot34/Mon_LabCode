<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fiche joueuse</title>
    <link rel="stylesheet" href="playerPageStyles.css">
    <script src="playerPageScript.js" defer></script>
</head>
<body>
    <main class="player-card-container">
        <div class="back-link-container">
            <a href="index.html" class="back-btn">← Retour à l'effectif</a>
        </div>
        <div class="player-profile-card">
            <div class="player-avatar-container">
                <img src="avatar.webp" alt="Avatar de la joueuse" class="player-avatar-img">
            </div>
            <h1 id="playerName">Nom Prénom</h1>
            <div class="player-info-grid">
                <div class="info-item">
                   <span class="label">Poste :</span>
                    <span id="playerPoste" class="value">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Catégorie :</span>
                    <span id="playerCategory" class="value">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Année de naissance :</span>
                    <span id="playerYear" class="value">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Poids :</span>
                    <span id="playerWeight" class="value">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Taille :</span>
                 <span id="playerHeight" class="value">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Disponibilité :</span>
                    <span id="playerDispo" class="value">-</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
